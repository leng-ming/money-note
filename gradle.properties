# 锁定用 JDK 17 构建（系统里默认的 JDK 25 对 AGP 8.x 太新）
org.gradle.java.home=H:\\Android\\jdk-17

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
